[default]
include_labels = ["shared", "common", "documentation"]

#! Abstractions
[abstract.gitignore]
generated_dir = "."
generated_file = ".gitignore"
override_dir = "."
override_file = "template.gitignore"
strategy = "append_bottom"

[abstract.gitattributes]
generated_dir = "."
generated_file = ".gitattributes"
override_dir = "."
override_file = "template.gitattributes"
strategy = "append_bottom"

[abstract.hk]
strategy = "none"

[abstract.vscode-extensions]
generated_dir = ".vscode/"
generated_file = "extensions.json"
override_dir = ".vscode/"
override_file = "extensions.template.jsonc"
strategy = "merge_json"

[abstract.vscode-settings]
generated_dir = ".vscode/"
generated_file = "settings.json"
override_dir = ".vscode/"
override_file = "settings.template.jsonc"
local_override_file = "settings.local.jsonc"
back_propagate = true
backprop_ignore = [
  "explorerExcludeManager.backup",
  "clangd.path",
  "cmake.cmakePath",
  "python.defaultInterpreterPath",
  "shellcheck.executablePath",
  "java.jdt.ls.java.home",
  "java.import.gradle.java.home",
  "ruff.interpreter",
  "ruff.path",
  "dart.flutterSdkPath",
  "debug.javascript.defaultRuntimeExecutable",
  "pkl.cli.path",
  "pkl.lsp.java.path",
  "oxc.path.node",
  "oxc.path.oxlint",
  "oxc.path.oxfmt",
  "hadolint.hadolintPath",
  "sonarlint.ls.javaHome",
  "sonarlint.pathToNodeExecutable",
  "ty.path",
  "tombi.path",
  "shellformat.path",
  "Lua.misc.executablePath",
  "dotnetAcquisitionExtension.sharedExistingDotnetPath",
  "lldb-dap.executable-path",
  "go.goroot",
  "go.alternateTools",
  "swift.path",
]
backprop_ignore_values = ["files.exclude.*"]
strategy = "merge_json"

#! Templates
[templates.rumdl]
template = "documentation/rumdl.toml"
strategy = "merge_toml"
labels = ["documentation"]

[templates.lychee]
template = "documentation/lychee.toml"
strategy = "merge_toml"
labels = ["documentation"]

[templates.cspell]
template = "documentation/cspell.yml"
strategy = "merge_yaml"
# labels = [ "documentation" ] # TODO enable once reviewed

[templates.license-apache]
template = "licenses/LICENSE-APACHE"
generated_file = "LICENSE"
generated_dir = "."  # License must be at project root
strategy = "none"
labels = ["license"]

[templates.license-notice-apache]
template = "licenses/license-notice-apache.md"  # HK checks the context of this is in the README
strategy = "none"
labels = ["license"]

[templates.jscpd]
template = "common/.jscpd.json"
strategy = "merge_json"
labels = ["common"]

[templates.kingfisher]
template = "common/kingfisher.yaml"
strategy = "merge_yaml"
labels = ["common"]

[templates.ls-lint]
template = "common/.ls-lint.yml"
strategy = "merge_yaml"
labels = ["common"]

[templates.mise-backend-lint]
template = "common/mise-backend-lint.sh"
strategy = "none"
labels = ["common"]

[templates.stylua]
template = "lua/stylua.toml"
strategy = "merge_toml"
labels = ["lua"]

[templates.stylelint]
template = "web/.stylelintrc.json"
strategy = "merge_json"
labels = ["web"]

[templates.htmlhint]
template = "web/.htmlhintrc"
strategy = "merge_json"
labels = ["web"]

[templates.yamlfmt]
template = "yaml/.yamlfmt"
strategy = "merge_yaml"
labels = ["yaml"]

[templates.yamllint]
template = "yaml/.yamllint"
strategy = "merge_yaml"
labels = ["yaml"]

[templates.hadolint]
template = "docker/.hadolint.yaml"
strategy = "merge_yaml"
labels = ["docker"]

[templates.oxfmt]
template = "javascript/.oxfmtrc.jsonc"
strategy = "merge_json"
labels = ["javascript"]

[templates.oxlint]
template = "javascript/.oxlintrc.jsonc"
strategy = "merge_json"
labels = ["javascript"]

[templates.detekt]
template = "kotlin/detekt.yml"
strategy = "merge_yaml"
labels = ["kotlin"]

[templates.clang-format]
template = "cpp/template.clang-format"
generated_file = ".clang-format"
generated_dir = "."  # Must be at root for clangd to find
override_dir = "."
strategy = "merge_yaml"
labels = ["cpp"]

[templates.clang-tidy]
template = "cpp/template.clang-tidy"
generated_file = ".clang-tidy"
generated_dir = "."  # Must be at root for clangd to find
override_dir = "."
strategy = "merge_yaml"
labels = ["cpp"]

[templates.shell-strict-lint]
template = "shell/check-strict-lint.sh"
strategy = "none"
labels = ["shell"]

